<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academic Lineage Family Tree</title>
  <meta name="description" content="Explore the PhD advisor lineage of 6,000+ computer science professors at US universities: who trained them, and whom they trained.">
  <link rel="icon" type="image/png" href="assets/tree-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,700;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <a class="logo" href="#/" aria-label="Academic Lineage Family Tree home"><img src="assets/tree-icon.png" alt="" width="40" height="40"></a>
    <nav>
      <a href="#/" data-nav="home">HOME</a>
      <a href="#/about" data-nav="about">ABOUT</a>
      <a href="#/favorites" class="pill" data-nav="favorites">FAVORITES <span id="favCount" class="fav-count" hidden></span></a>
    </nav>
  </header>

  <main>
    <!-- 首页 / 搜索页 -->
    <section id="view-home" class="view hero" hidden>
      <h1 class="title">Academic Lineage<br><span>Family<img src="assets/icons/icon_whiteleaf.png" alt="" class="leaf">Tree</span></h1>
      <div class="search-card" data-search="home"></div>
      <p class="hero-stats" id="heroStats"></p>
    </section>

    <!-- 结果页 -->
    <section id="view-results" class="view results" hidden>
      <div class="search-card compact" data-search="results"></div>
      <div class="results-head">
        <h2 id="resCount"></h2>
        <div class="results-tools">
          <label class="name-filter"><img src="assets/icons/icon_search.png" alt=""><input id="nameFilter" type="search" placeholder="Filter by name" aria-label="Filter results by name"></label>
          <label class="toggle"><input type="checkbox" id="onlyKnown"> Known advisor only</label>
          <select id="sort" aria-label="Sort results">
            <option value="lineage">Most connected</option>
            <option value="name">Name</option>
            <option value="uni">Institution</option>
          </select>
        </div>
      </div>
      <ul id="cards" class="cards"></ul>
      <button id="more" class="btn-light" type="button" hidden>Show more</button>
    </section>

    <!-- 收藏页 -->
    <section id="view-favorites" class="view results" hidden>
      <div class="results-head"><h2>Favorites</h2></div>
      <p class="muted">Professors you star are kept in this browser only.</p>
      <ul id="favCards" class="cards"></ul>
    </section>

    <!-- 谱系树页 -->
    <section id="view-tree" class="view tree-page" hidden>
      <div class="tree-shell" id="treeShell">
        <div class="tree-top">
          <button id="backBtn" class="btn-dark" type="button">Back</button>
          <div class="tree-title" id="treeTitle"></div>
          <div class="tree-tools">
            <button type="button" id="zoomIn" title="Zoom in"><img src="assets/icons/icon_zoomin.png" alt="Zoom in"></button>
            <button type="button" id="zoomOut" title="Zoom out"><img src="assets/icons/icon_zoomout.png" alt="Zoom out"></button>
            <button type="button" id="fullBtn" title="Full screen"><img src="assets/icons/icon_wholescreen.png" alt="Full screen"></button>
          </div>
        </div>
        <div class="tree-stage">
          <button class="gen-arrow left" id="genLeft" type="button" aria-label="Show earlier generations"></button>
          <div class="tree-viewport" id="viewport">
            <div class="tree-scale" id="scaleBox">
              <svg class="links" id="links" aria-hidden="true"></svg>
              <div class="bands" id="bands"></div>
            </div>
          </div>
          <button class="gen-arrow right" id="genRight" type="button" aria-label="Show later generations"></button>
          <aside class="drawer" id="drawer" aria-live="polite"></aside>
        </div>
        <div class="tree-legend">
          <span><i class="ln phd"></i>PhD advisor</span>
          <span><i class="ln postdoc"></i>Postdoc advisor</span>
          <span><i class="ln inferred"></i>Inferred</span>
          <span><i class="ln disputed"></i>Unverified</span>
          <span class="hint">Click a person for details · double-click to re-center · ← advisors · students →</span>
        </div>
      </div>
    </section>

    <!-- 关于 -->
    <section id="view-about" class="view about" hidden>
      <article class="about-card" id="aboutBody"></article>
    </section>
  </main>

  <div id="tip" class="tip" hidden></div>
  <noscript><p class="noscript">This site needs JavaScript to draw the lineage tree.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
